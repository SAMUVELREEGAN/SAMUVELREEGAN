<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" fill="none" role="img" aria-label="Web development workspace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141414"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="screen" x1="120" y1="140" x2="520" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1e1e"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff6600"/>
      <stop offset="1" stop-color="#e05500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="720" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="638" height="718" rx="23" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- grid -->
  <g opacity="0.06" stroke="#ffffff">
    <path d="M0 80H640M0 160H640M0 240H640M0 320H640M0 400H640M0 480H640M0 560H640M0 640H640"/>
    <path d="M80 0V720M160 0V720M240 0V720M320 0V720M400 0V720M480 0V720M560 0V720"/>
  </g>

  <!-- monitor -->
  <rect x="88" y="108" width="464" height="292" rx="18" fill="#0d0d0d" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="104" y="124" width="432" height="244" rx="10" fill="url(#screen)"/>

  <!-- browser chrome -->
  <rect x="104" y="124" width="432" height="34" rx="10" fill="#181818"/>
  <circle cx="124" cy="141" r="5" fill="#ff5f57"/>
  <circle cx="142" cy="141" r="5" fill="#febc2e"/>
  <circle cx="160" cy="141" r="5" fill="#28c840"/>
  <rect x="188" y="133" width="220" height="16" rx="8" fill="#101010" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- code lines -->
  <g opacity="0.95">
    <rect x="124" y="178" width="72" height="8" rx="4" fill="#ff6600" opacity="0.9"/>
    <rect x="124" y="198" width="180" height="7" rx="3.5" fill="#ffffff" opacity="0.18"/>
    <rect x="140" y="216" width="220" height="7" rx="3.5" fill="#ffffff" opacity="0.14"/>
    <rect x="140" y="234" width="160" height="7" rx="3.5" fill="#ffffff" opacity="0.14"/>
    <rect x="124" y="258" width="96" height="8" rx="4" fill="#61dafb" opacity="0.75"/>
    <rect x="140" y="278" width="240" height="7" rx="3.5" fill="#ffffff" opacity="0.16"/>
    <rect x="140" y="296" width="190" height="7" rx="3.5" fill="#ffffff" opacity="0.12"/>
    <rect x="124" y="320" width="120" height="8" rx="4" fill="#68a063" opacity="0.85"/>
    <rect x="140" y="340" width="260" height="7" rx="3.5" fill="#ffffff" opacity="0.14"/>
  </g>

  <!-- monitor stand -->
  <rect x="288" y="400" width="64" height="28" rx="6" fill="#151515" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="248" y="428" width="144" height="12" rx="6" fill="#111"/>

  <!-- floating badges -->
  <g filter="url(#glow)">
    <rect x="48" y="468" width="118" height="118" rx="22" fill="#161616" stroke="#ff6600" stroke-opacity="0.35"/>
    <circle cx="107" cy="512" r="26" fill="#202020"/>
    <path d="M107 492c-11 0-20 9-20 20s9 20 20 20 20-9 20-20-9-20-20-20zm0 6c7.7 0 14 6.3 14 14s-6.3 14-14 14-14-6.3-14-14 6.3-14 14-14z" fill="#61dafb"/>
    <circle cx="107" cy="512" r="4" fill="#61dafb"/>
    <text x="107" y="552" text-anchor="middle" fill="#f0e6d4" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">React</text>
  </g>

  <g>
    <rect x="474" y="468" width="118" height="118" rx="22" fill="#161616" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="533" cy="512" r="26" fill="#202020"/>
    <rect x="519" y="500" width="28" height="24" rx="6" fill="#68a063"/>
    <text x="533" y="552" text-anchor="middle" fill="#f0e6d4" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Node.js</text>
  </g>

  <!-- keyboard hint -->
  <rect x="156" y="520" width="328" height="88" rx="16" fill="#121212" stroke="#ffffff" stroke-opacity="0.08"/>
  <g opacity="0.35">
    <rect x="176" y="542" width="28" height="10" rx="3" fill="#fff"/>
    <rect x="212" y="542" width="28" height="10" rx="3" fill="#fff"/>
    <rect x="248" y="542" width="28" height="10" rx="3" fill="#fff"/>
    <rect x="284" y="542" width="28" height="10" rx="3" fill="#fff"/>
    <rect x="320" y="542" width="28" height="10" rx="3" fill="#fff"/>
    <rect x="356" y="542" width="28" height="10" rx="3" fill="#fff"/>
    <rect x="392" y="542" width="28" height="10" rx="3" fill="#fff"/>
    <rect x="428" y="542" width="28" height="10" rx="3" fill="#fff"/>
    <rect x="188" y="562" width="264" height="10" rx="3" fill="#ff6600" opacity="0.8"/>
  </g>

  <!-- label -->
  <rect x="48" y="48" width="168" height="34" rx="17" fill="#ff6600" fill-opacity="0.12" stroke="#ff6600" stroke-opacity="0.35"/>
  <text x="132" y="70" text-anchor="middle" fill="#ff6600" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">WEB DEVELOPMENT</text>

  <text x="48" y="662" fill="#a89880" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500">Full-Stack Developer</text>
  <text x="48" y="686" fill="#f0e6d4" font-family="Georgia, serif" font-size="22" font-weight="700" font-style="italic">Samuvel Reegan</text>
</svg>
